# Host Nginx — reverse proxy in front of the Docker frontend container.
# Replace "your-domain.com" with your actual domain everywhere in this file.
#
# Setup:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/buh-manager
#   sudo ln -s /etc/nginx/sites-available/buh-manager /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your-domain.com   # obtain/install Let's Encrypt certificate
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
